<!DOCTYPE html>
<html>
<head>
<link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
  <h2>Original Editor</h2>
  <div id="editor">
    <p>Line 1</p>
    <p><br></p>
    <p>Line 2</p>
  </div>

  <h2>Viewer (whitespace-normal)</h2>
  <div class="ql-editor !p-0 whitespace-normal">
    <p>Line 1</p>
    <p><br></p>
    <p>Line 2</p>
  </div>
  
  <h2>Viewer (whitespace-pre-wrap)</h2>
  <div class="ql-editor !p-0 whitespace-pre-wrap">
    <p>Line 1</p>
    <p><br></p>
    <p>Line 2</p>
  </div>
  
  <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
  <script>
    var quill = new Quill('#editor', {
      theme: 'snow'
    });
  </script>
</body>
</html>
