<!DOCTYPE html>
<html>
<head>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
  <h2>Without CSS fix</h2>
  <div class="whitespace-pre-wrap" style="background: #f0f0f0; border: 1px solid red; margin-bottom: 20px;">
    <p>Line 1</p><p></p><p>Line 2</p>
  </div>

  <h2>With CSS fix</h2>
  <div class="whitespace-pre-wrap [&_p:empty]:after:content-['\00a0']" style="background: #f0f0f0; border: 1px solid red;">
    <p>Line 1</p><p></p><p>Line 2</p>
  </div>
</body>
</html>
